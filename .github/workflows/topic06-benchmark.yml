name: Topic 06 Compiler Benchmark

on:
  push:
  pull_request:

jobs:
  topic06-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ScratchV and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[topic06-report]"

      - name: Verify Topic 06 integration contracts
        run: python -m pytest tests/topic06/test_integration.py -q

      - name: Run supported correctness gates
        run: |
          python scripts/run_topic06_benchmarks.py --category activation --fail-on-test-failure
          python scripts/run_topic06_benchmarks.py --category elementwise --fail-on-test-failure
          python scripts/run_topic06_benchmarks.py --category loop --fail-on-test-failure

      - name: Generate full diagnostic benchmark report
        run: python scripts/run_topic06_benchmarks.py --full-report

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmark_reports/topic06/report.md ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              report_repository="${{ github.event.pull_request.head.repo.full_name }}"
              report_revision="${{ github.event.pull_request.head.sha }}"
            else
              report_repository="${{ github.repository }}"
              report_revision="${{ github.sha }}"
            fi

            raw_base="https://raw.githubusercontent.com/${report_repository}/${report_revision}/benchmark_reports/topic06"
            browse_base="https://github.com/${report_repository}/tree/${report_revision}/benchmark_reports/topic06"
            sed \
              -e "s#](course_report_instructions.png)#](${raw_base}/course_report_instructions.png)#g" \
              -e "s#](cases/)#](${browse_base}/cases)#g" \
              benchmark_reports/topic06/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Topic 06 report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Topic 06 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic06-benchmark-reports
          path: |
            benchmark_reports/topic06/report.md
            benchmark_reports/topic06/report.json
            benchmark_reports/topic06/report.html
            benchmark_reports/topic06/course_report_instructions.png
            benchmark_reports/topic06/cases/
            benchmark_reports/topic06/failures/
            benchmarks/topic06/baseline.json
